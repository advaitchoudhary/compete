name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: allsports
          POSTGRES_PASSWORD: password
          POSTGRES_DB: allsports_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://allsports:password@localhost:5432/allsports_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://allsports:password@localhost:5432/allsports_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-chars-long
          NODE_ENV: test

  # ── Rating Engine ─────────────────────────────────────────────────────────────
  rating-engine:
    name: Rating Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rating-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rating-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  # ── Docker Build Check ────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, rating-engine]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false

      - name: Build realtime image
        uses: docker/build-push-action@v5
        with:
          context: ./realtime
          target: production
          push: false

      - name: Build rating-engine image
        uses: docker/build-push-action@v5
        with:
          context: ./rating-engine
          push: false

  # ── Deploy to Fly.io (main branch only) ───────────────────────────────────────
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Each app has its own fly.toml; flyctl builds the image from the Dockerfile
      # (production target) and deploys. The backend's release_command runs pending
      # migrations before the new release takes traffic.
      - name: Deploy backend
        working-directory: backend
        run: flyctl deploy --remote-only

      - name: Deploy realtime
        working-directory: realtime
        run: flyctl deploy --remote-only

      - name: Deploy rating-engine
        working-directory: rating-engine
        run: flyctl deploy --remote-only
