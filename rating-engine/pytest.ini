[pytest]
testpaths = tests

# The service isn't an installed package — `algorithms`, `consumer` and `config`
# are top-level modules sitting next to this file. pytest's default "prepend"
# import mode only puts the *test file's* directory (tests/) on sys.path, so
# `from algorithms.base import ...` fails under a bare `pytest` invocation.
#
# `python -m pytest` happens to work because that form also adds the CWD, which
# is exactly the trap: it passes locally and fails in CI. Declaring the path here
# makes it work the same way however pytest is invoked.
pythonpath = .
